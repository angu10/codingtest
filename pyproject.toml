[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "interface-cua"
version = "0.1.0"
description = "Deterministic computer-use capability discovery and replay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.68,<1",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
interface-cua = "interface_cua.cli:main"
interface-cua-schema = "interface_cua.schema.artifact:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interface_cua", "demo_app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
